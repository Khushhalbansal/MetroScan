# Alembic configuration.
#
# The database URL is deliberately absent. It comes from app.core.config at runtime
# (see alembic/env.py), so a migration always runs against the same database the API
# is using and cannot be pointed somewhere else by an out-of-date ini file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migrations are ordered by this prefix, so a file listing reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
