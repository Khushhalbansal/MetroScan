<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />

      content="MetroScan — a compliance bench for Legal Metrology enforcement. Photograph a packaged commodity; get the mandatory declarations checked against the Packaged Commodities Rules, 2011."
    />

    <!--
      Archivo for display (pushed wide, engineered signage), IBM Plex Sans +
      Devanagari for body, IBM Plex Mono for every number. Self-hosted via

      on a CDN reaching it; the token stacks fall back to system faces meanwhile.
    -->
  </head>
