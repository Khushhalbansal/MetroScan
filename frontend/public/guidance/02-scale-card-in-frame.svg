<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img"
     aria-label="Top view. A scale card lies flat beside the pack, inside the photographed frame and in the same plane as the label.">
  <title>Lay the scale card flat beside the pack, inside the frame</title>
  <rect width="420" height="260" fill="#F4F5F2"/>

  <!-- the photographed frame, as brass corner marks -->
  <g stroke="#A67C2E" stroke-width="1.6" fill="none">
    <path d="M22 44 V26 H40 M380 26 H398 V44 M398 216 V234 H380 M40 234 H22 V216"/>
  </g>

  <!-- the pack -->
  <rect x="58" y="52" width="188" height="156" fill="#FFFFFF" stroke="#16191C" stroke-width="1.4"/>
  <g font-family="IBM Plex Sans, sans-serif" fill="#33383D">
    <text x="72" y="76" font-size="13" font-weight="600">Sunrise Foods</text>
    <text x="72" y="96" font-size="9">Roasted Chana Masala</text>
    <text x="72" y="118" font-size="11" font-weight="600">Net Qty: 200 g</text>
    <text x="72" y="138" font-size="11" font-weight="600">MRP Rs. 45.00</text>
    <text x="72" y="154" font-size="8">(inclusive of all taxes)</text>
    <text x="72" y="172" font-size="8">Mfd. 03/2026</text>
  </g>

  <!-- the ArUco scale card, flat, same plane, fully inside the frame -->
  <g>
    <rect x="276" y="120" width="88" height="88" fill="#16191C"/>
    <g fill="#F4F5F2">
      <rect x="298" y="142" width="22" height="44"/>
      <rect x="298" y="164" width="44" height="22"/>
      <rect x="320" y="186" width="22" height="22"/>
    </g>
    <!-- 40 mm dimension line -->
    <g stroke="#A67C2E" stroke-width="1.1">
      <path d="M276 112 H364"/>
      <path d="M276 108 V116 M364 108 V116"/>
    </g>
    <text x="320" y="102" text-anchor="middle" font-family="IBM Plex Mono, monospace"
          font-size="10" fill="#A67C2E">40 mm</text>
  </g>

  <text x="210" y="252" text-anchor="middle" font-family="IBM Plex Sans, sans-serif"
        font-size="11" fill="#4A4F54">
    A card, an ID-1 card or a ₹5 / ₹10 coin — flat, in the same plane as the label
  </text>
</svg>
